# LoRA v2b (rows over 6 144 tokens dropped: NaN in v2) on Qwen3-8B (4-bit MLX): distilled full-coverage chunks + 250 ATT&CK + official STIX x2 (prepare.py --distill)
model: mlx-community/Qwen3-8B-4bit
train: true
data: training/data/mlx-v2b
fine_tune_type: lora
mask_prompt: true          # learn the answer only, not the prompt
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 616
learning_rate: 5.0e-5
max_seq_length: 6144
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 25
save_every: 200
adapter_path: training/adapters/qwen3-8b-v2b
seed: 7
