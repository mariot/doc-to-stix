# LoRA v3 on Qwen3-8B (4-bit MLX): v2b + 55 more distilled training documents, labels consolidated by engine 0.4 rules
model: mlx-community/Qwen3-8B-4bit
train: true
data: training/data/mlx-v3
fine_tune_type: lora
mask_prompt: true          # learn the answer only, not the prompt
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: ITERS
learning_rate: 5.0e-5
max_seq_length: 6144
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 25
save_every: 200
adapter_path: training/adapters/qwen3-8b-v3
seed: 7
