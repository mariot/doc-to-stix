# LoRA on Qwen3-8B (4-bit MLX), training/data/mlx (prepare.py --attack 1200 --doc-weight 4)
model: mlx-community/Qwen3-8B-4bit
train: true
data: training/data/mlx
fine_tune_type: lora
mask_prompt: true          # learn the answer only, not the prompt
num_layers: 16
batch_size: 1
grad_accumulation_steps: 4
iters: 1300                # one pass over the 1 300 training rows
learning_rate: 1.0e-4
max_seq_length: 6144
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 25
save_every: 200
adapter_path: training/adapters/qwen3-8b-v1
seed: 7
